# =====================================================================
# BugBuster Platform — единый CI/CD пайплайн монорепозитория
#
#   Job 1 «deploy-shop»   → публикует папку shop/ на GitHub Pages (ветка gh-pages)
#   Job 2 «run-autotests» → гоняет Java/Playwright автотесты против ЗАДЕПЛОЕННОГО сайта,
#                           публикует Allure-отчёт в gh-pages/allure и шлёт итог в Telegram
#
# Итоговые адреса:
#   Магазин:      https://<username>.github.io/<repo>/
#   Allure-отчёт: https://<username>.github.io/<repo>/allure/
#
# Разовая настройка репозитория (Settings):
#   1. Settings → Pages → Source: «Deploy from a branch», Branch: gh-pages / (root)
#      (ветка gh-pages появится после первого запуска пайплайна).
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        TELEGRAM_BOT_TOKEN — токен бота от @BotFather
#        TELEGRAM_CHAT_ID   — id канала/чата (например -1001234567890), бот должен быть админом канала
# =====================================================================

name: CI/CD — Deploy Shop & Run Autotests

# ---------------------------------------------------------------------
# ТРИГГЕРЫ: когда запускается пайплайн
# ---------------------------------------------------------------------
on:
  # 1) Разработчик запушил изменения в main/master → деплой + регресс.
  push:
    branches: [main, master]
    # Пуш, меняющий только README/документацию, пайплайн не запускает.
    paths-ignore:
      - '**.md'
      - 'docs/**'

  # 2) Ночной/утренний регресс по расписанию: каждый день в 09:00 UTC (12:00 МСК).
  #    Формат cron: минута час день_месяца месяц день_недели.
  schedule:
    - cron: '0 9 * * *'

  # 3) Ручной запуск кнопкой «Run workflow» во вкладке Actions (удобно на защите).
  workflow_dispatch:

# ---------------------------------------------------------------------
# ПРАВА токена GITHUB_TOKEN: нужна запись в репозиторий,
# чтобы пушить в ветку gh-pages (сайт + Allure-отчёт).
# ---------------------------------------------------------------------
permissions:
  contents: write

# ---------------------------------------------------------------------
# Не даём двум запускам одновременно пушить в gh-pages (иначе конфликт коммитов).
# Новый запуск ждёт окончания предыдущего, а не отменяет его.
# ---------------------------------------------------------------------
concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===================================================================
  # JOB 0: TELEGRAM — «ПАЙПЛАЙН ЗАПУЩЕН»
  # Без needs — стартует сразу, параллельно с деплоем: команда узнаёт,
  # что пришли новые изменения и тесты уже в работе, не дожидаясь итога.
  # ===================================================================
  notify-start:
    name: 📣 Notify pipeline started
    runs-on: ubuntu-latest
    steps:
      - name: 📣 Telegram — пайплайн запущен
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Секреты TELEGRAM_* не заданы — уведомление пропущено"
            exit 0
          fi

          case "$EVENT" in
            push)              TRIGGER="push в ${GITHUB_REF_NAME}" ;;
            schedule)          TRIGGER="по расписанию ⏰" ;;
            workflow_dispatch) TRIGGER="вручную 🖐" ;;
            *)                 TRIGGER="$EVENT" ;;
          esac

          # Первая строка коммита, с экранированием символов HTML
          COMMIT=$(printf '%s' "${COMMIT_MSG:-—}" | head -n1 | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')

          TEXT="⚗️ <b>BugBuster Alchemy</b>
          🚀 <b>Новая версия в пути!</b> Деплой магазина и автотесты запущены.

          👤 Запустил: <b>${ACTOR}</b> (${TRIGGER})
          📝 Коммит: <code>${GITHUB_SHA::7}</code> ${COMMIT}

          ⏳ Итог придёт отдельным сообщением через несколько минут.
          ⚙️ <a href=\"${RUN_URL}\">Следить за пайплайном</a>"

          # Убираем отступы YAML в начале строк
          TEXT=$(printf '%s' "$TEXT" | sed 's/^ *//')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /dev/null -w "Telegram API HTTP %{http_code}\n"

  # ===================================================================
  # JOB 1: ДЕПЛОЙ МАГАЗИНА НА GITHUB PAGES
  # ===================================================================
  deploy-shop:
    name: 🚀 Deploy shop to GitHub Pages
    runs-on: ubuntu-latest

    # Передаём адрес сайта во второй job через outputs.
    outputs:
      site_url: ${{ steps.url.outputs.site_url }}

    steps:
      # Скачиваем код репозитория на раннер.
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Вычисляем адрес GitHub Pages.
      # Почему не github.event.repository.name? При запуске по schedule
      # в событии может не быть объекта repository, поэтому берём имя из GITHUB_REPOSITORY.
      # Имя пользователя приводим к нижнему регистру — так его отдаёт GitHub Pages.
      - name: 🔗 Compute GitHub Pages URL
        id: url
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "site_url=https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"

      # Готовим папку для публикации:
      #  - копируем shop/;
      #  - version.txt с SHA коммита — по нему Job 2 поймёт, что задеплоилась НОВАЯ версия;
      #  - подставляем короткий SHA в футер сайта (видно на защите, какая версия на проде);
      #  - .nojekyll отключает обработку Jekyll на GitHub Pages.
      - name: 🧪 Prepare shop for publishing
        run: |
          mkdir -p public
          cp -r shop/. public/
          echo "${GITHUB_SHA}" > public/version.txt
          sed -i "s/build: local/build: ${GITHUB_SHA::7}/" public/index.html
          touch public/.nojekyll

      # Публикуем public/ в КОРЕНЬ ветки gh-pages.
      # keep_files: true — НЕ удаляем то, что уже лежит в ветке (папку allure/ с историей отчётов!).
      - name: 🌐 Publish shop to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: true
          commit_message: '🚀 Deploy shop'

  # ===================================================================
  # JOB 2: АВТОТЕСТЫ + ALLURE + TELEGRAM
  # needs: deploy-shop — стартует строго ПОСЛЕ успешного деплоя.
  # ===================================================================
  run-autotests:
    name: 🧪 Run Java autotests
    runs-on: ubuntu-latest
    needs: deploy-shop

    # Все команды run по умолчанию выполняются в папке autotests/ (там gradlew).
    defaults:
      run:
        working-directory: ./autotests

    env:
      SITE_URL: ${{ needs.deploy-shop.outputs.site_url }}

    steps:
      # Скачиваем код (нужна папка autotests/).
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # Устанавливаем JDK 21 (дистрибутив Eclipse Temurin).
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Настраиваем Gradle и кэш зависимостей (~/.gradle) между запусками.
      # Кэш ключуется по build.gradle/settings.gradle/wrapper — при изменении зависимостей он обновится.
      # (Параметр cache-dependency-path относится к setup-java; при использовании setup-gradle
      #  его кэш включать не нужно — два кэша Gradle конфликтуют.)
      - name: 🐘 Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # gradlew мог потерять флаг исполняемости при коммите с Windows — восстанавливаем.
      - name: 🔑 Make gradlew executable
        run: chmod +x gradlew

      # Ставим Chromium и системные библиотеки Linux через нашу кастомную Gradle-задачу.
      # -PwithDeps добавляет флаг --with-deps (apt-get пакеты для браузера).
      - name: 🎭 Install Playwright Chromium + Linux deps
        run: ./gradlew playwrightInstall -PwithDeps

      # GitHub Pages обновляется не мгновенно (обычно 30–90 сек после пуша в gh-pages).
      # Ждём, пока по адресу сайта начнёт отдаваться version.txt с SHA ТЕКУЩЕГО коммита,
      # иначе тесты могут проверить старую версию сайта (и демо с багом «не сработает»).
      - name: ⏳ Wait for GitHub Pages to serve the new build
        run: |
          for i in $(seq 1 40); do
            DEPLOYED=$(curl -fsS -H 'Cache-Control: no-cache' "${SITE_URL}version.txt?ts=$(date +%s)" || true)
            if [ "$DEPLOYED" = "$GITHUB_SHA" ]; then
              echo "✅ Pages отдаёт актуальную сборку ${GITHUB_SHA::7}"
              exit 0
            fi
            echo "…попытка $i/40: на Pages пока '${DEPLOYED:-нет ответа}', ждём 15 сек"
            sleep 15
          done
          echo "::warning::Не дождались новой версии на Pages — тесты пойдут по текущей"

      # Запускаем тесты против задеплоенного магазина в headless-режиме.
      # continue-on-error: true — даже если тесты упали, идём дальше:
      # отчёт нужно сгенерировать и отправить в Telegram. Job «покраснеет» в самом конце.
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 — не даём Playwright докачивать Firefox/WebKit
      # при старте: Chromium уже установлен шагом playwrightInstall.
      - name: 🧪 Run autotests
        id: tests
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ./gradlew clean test -DbaseUrl="${SITE_URL}" -Dheadless=true

      # Скачиваем текущее содержимое gh-pages, чтобы взять оттуда историю прошлых
      # Allure-запусков (папка allure/last-history) — тогда в отчёте будут тренды.
      # При самом первом запуске ветки ещё может не быть — это не ошибка.
      - name: 📚 Checkout gh-pages (Allure history)
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-branch

      # Генерируем Allure-отчёт с историей:
      #  - gh_pages: прошлая папка allure/ из gh-pages (откуда брать last-history);
      #  - allure_history: куда сложить новый отчёт (папка <run_number>/) + обновлённую историю;
      #  - report_url: базовый адрес отчётов, на него ведёт redirect из allure/index.html.
      # Пути здесь — от корня репозитория (у uses нет working-directory).
      # Версия v1.15+: старые версии собирались из удалённого Docker-образа openjdk:8-jre-alpine и падали.
      - name: 📊 Generate Allure report with history
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: autotests/build/allure-results
          allure_report: allure-report
          gh_pages: gh-pages-branch/allure
          allure_history: allure-history
          keep_reports: 20
          report_url: ${{ env.SITE_URL }}allure
          report_name: 'BugBuster Alchemy — автотесты'

      # ---------------------------------------------------------------
      # Коллаж для Telegram (qa-guru/allure-notifications) строится по отчёту Allure 3.
      # Публичный отчёт выше остаётся на Allure 2 — этот нужен только для уведомления.
      # Конфиги: notifications/allurerc.mjs (генерация) и notifications/config.json (коллаж).
      # ---------------------------------------------------------------
      - name: 🟢 Set up Node (Allure 3)
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: 26

      # История прошлых запусков для графиков «динамики» на коллаже.
      # Лежит в gh-pages рядом с отчётами: allure/allure3-history.jsonl.
      # При первом запуске файла нет — Allure просто начнёт новую историю.
      - name: 📚 Restore Allure 3 history
        if: always()
        working-directory: .
        run: cp gh-pages-branch/allure/allure3-history.jsonl ./allure3-history.jsonl 2>/dev/null || echo "Истории пока нет — начинаем с нуля"

      - name: 📊 Generate Allure 3 report (for Telegram collage)
        if: always()
        working-directory: .
        run: |
          npm install --no-save allure@3.14.3
          npx allure generate autotests/build/allure-results --config notifications/allurerc.mjs

      # Кладём обновлённую историю в allure-history/ — она уйдёт в gh-pages/allure следующим шагом.
      # sudo нужен потому, что папку allure-history создал simple-elf/allure-report-action:
      # это Docker-Action, он пишет файлы от root, и обычному пользователю раннера туда писать нельзя.
      - name: 💾 Save Allure 3 history for gh-pages
        if: always()
        working-directory: .
        run: |
          if [ -f allure3-history.jsonl ]; then
            sudo mkdir -p allure-history
            sudo cp allure3-history.jsonl allure-history/allure3-history.jsonl
          else
            echo "::warning::allure3-history.jsonl не найден — история в этот раз не сохранится"
          fi

      # Публикуем отчёт в подпапку allure/ ветки gh-pages.
      # keep_files: true — НЕ трогаем магазин в корне ветки и старые отчёты.
      - name: 🌐 Publish Allure report to gh-pages/allure
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: allure
          keep_files: true
          commit_message: '📊 Allure report #${{ github.run_number }}'

      # Без секретов Action упал бы в режиме live — проверяем заранее и просто пропускаем отправку.
      - name: 🔐 Check Telegram secrets
        id: telegram
        if: always()
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секреты TELEGRAM_* не заданы — уведомление пропущено"
          fi

      # Итог в Telegram: картинка-коллаж (7 панелей) + статистика + ссылки на отчёт и лог CI.
      # Токен и chat_id берутся из секретов репозитория и не видны в логах.
      - name: 📣 Send Telegram notification (allure-notifications)
        if: always() && steps.telegram.outputs.configured == 'true'
        uses: qa-guru/allure-notifications@v6.3.2
        with:
          config: notifications/config.json
          allure-folder: allure3-report/awesome
          allure-results-folder: autotests/build/allure-results
          report-url: ${{ env.SITE_URL }}allure/${{ github.run_number }}/
          build-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mode: live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Финальный «светофор»: если тесты упали — красим job в красный,
      # чтобы в GitHub (и на бейджах) было видно, что релиз сломан.
      - name: 🚦 Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Автотесты упали — смотрите Allure-отчёт: ${SITE_URL}allure/${GITHUB_RUN_NUMBER}/"
          exit 1

  # ===================================================================
  # JOB 3: TELEGRAM — «ДЕПЛОЙ УПАЛ»
  # Если deploy-shop упал, run-autotests пропускается целиком (needs),
  # и его итоговое сообщение не отправится. Этот job закрывает эту дыру.
  # if: failure() — запускается, только если упал job из needs.
  # ===================================================================
  notify-deploy-failure:
    name: 📣 Notify deploy failure
    runs-on: ubuntu-latest
    needs: deploy-shop
    if: failure()
    steps:
      - name: 📣 Telegram — деплой упал
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Секреты TELEGRAM_* не заданы — уведомление пропущено"
            exit 0
          fi

          TEXT="⚗️ <b>BugBuster Alchemy</b>
          💥 <b>Деплой магазина упал!</b> Автотесты не запускались.

          👤 Запустил: <b>${ACTOR}</b>
          📝 Коммит: <code>${GITHUB_SHA::7}</code>

          ⚙️ <a href=\"${RUN_URL}\">Смотреть лог CI</a>"

          TEXT=$(printf '%s' "$TEXT" | sed 's/^ *//')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /dev/null -w "Telegram API HTTP %{http_code}\n"
